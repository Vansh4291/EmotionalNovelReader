<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ENR Validation Harness</title>
<style>
  /* App-root sizing: simulate a phone viewport inside a device frame. */
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1e; font-family: sans-serif; }
  #phone-frame {
    width: 390px; height: 844px; margin: 24px auto; border-radius: 28px;
    overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,0.55);
    background: #090909; position: relative;
  }
  #root { height: 100%; }
  #root > * { height: 100%; }
  @keyframes enr-spin { to { transform: rotate(360deg); } }
  /* Keep native range inputs invisible but interactive (slider shim). */
  input[type="range"] { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
  <div id="phone-frame">
    <div id="root"></div>
  </div>
  <div id="alert-region"></div>
  <script src="./harness.js"></script>
</body>
</html>
